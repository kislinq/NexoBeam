name: Keep Render proxy awake

on:
  schedule:
    - cron: "2,16,30,44,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Render proxy health
        env:
          RENDER_PROXY_URL: ${{ vars.RENDER_PROXY_URL }}
        run: |
          if [ -z "$RENDER_PROXY_URL" ]; then
            echo "Set the RENDER_PROXY_URL repository variable to the Render service URL."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 \
            --retry 2 --retry-delay 2 \
            "${RENDER_PROXY_URL%/}/_health"
